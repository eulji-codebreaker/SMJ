<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            padding: 100px;
            margin: auto;
            max-width: 500px;
        }

        .box {
            padding: 20px;
            margin: 10px;
            border: 1px solid #bebebe;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            margin: 5px;
            background-color: #2477b3;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            padding: 10px;
            margin: 5px;
            background-color: #1b2378;
            color: #ffffff;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div id="box1" class="box">첫 번째 박스입니다.</div>
    <div id="box2" class="box">두 번째 박스입니다.</div>

    <p id="message">여기에 메시지가 표시됩니다.</p>

    <button onclick="changeBox1()">첫 번째 박스 선택</button>
    <button onclick="changeBox2()">두 번째 박스 선택</button>
    <button onclick="changeMessage()">메세지 선택</button>

    <script>
        function changeBox1() {
            var box = document.getElementById("box1");
            box.innerText = "첫 번째 박스를 찾았습니다.";
            box.style.backgroundColor = "#f6b0b0"
        }

        function changeBox2() {
            var box = document.getElementById("box2");
            box.innerText = "두 번째 박스를 찾았습니다.";
            box.style.backgroundColor = "#b0f6b9"
        }

        function changeMessage() {
            var msg = document.getElementById("message");
            msg.textContent = "ID로 요소를 성공적으로 찾았습니다";
            msg.style.color = "#2477b3";
            msg.style.fontSize = "20px";
            msg.style.fontWeight = "bold";
        }
    </script>
</body>

</html>
