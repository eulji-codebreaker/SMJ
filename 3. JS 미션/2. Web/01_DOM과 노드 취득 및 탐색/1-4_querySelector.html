<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>querySelector</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    .container {
      border: 2px solid #ddd;
      padding: 20px;
      margin: 15px 0;
      border-radius: 8px;
    }

    .box {
      padding: 10px;
      margin: 8px 0;
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 4px;
    }

    .special {
      background-color: #fff3cd;
      border-color: #ffeaa7;
    }

    ul li {
      padding: 5px;
      margin: 3px 0;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>

</head>

<body>

  <div class="container">
    <h2 id="title">제목 영역</h2>
    <p class="box">첫 번째 박스</p>
    <p class="box special">두 번째 박스 (특별)</p>
    <p class="box">세 번째 박스</p>
  </div>

  <div class="container">
    <ul>
      <li>첫 번째 목록</li>
      <li class="special">두 번째 목록 (특별)</li>
      <li>세 번째 목록</li>
      <li>네 번째 목록</li>
    </ul>
  </div>

  <div class="container">
    <input type="text" placeholder="텍스트 입력">
    <input type="email" placeholder="이메일 입력">
    <button type="button">일반 버튼</button>
  </div>

  <div style="margin-top:20px">
    <button onclick="selectById()">ID 선택</button>
    <button onclick="selectByClass()">클래스 선택</button>
    <button onclick="selectByTag()">태그 선택</button>
    <button onclick="selectSpecial()">special 선택</button>
    <button onclick="selectFirst()">첫 번째 선택</button>
    <button onclick="selectAll()">모든 box</button>
    <button onclick="selectComplex()">복합 선택</button>
    <button onclick="selectInput()">입력 필드</button>
  </div>

  <script>

    function selectById() {
      var t = document.querySelector("#title");
      t.innerHTML = "ID로 선택된 제목!";
      t.style.color = "#dc3545";
    }

    function selectByClass() {
      var b = document.querySelector(".box");
      b.innerHTML = "클래스로 선택된 첫 번째 박스!";
      b.style.backgroundColor = "#d4edda";
    }

    function selectByTag() {
      var p = document.querySelector("p");
      p.innerHTML = "태그로 선택된 첫 번째 p!";
      p.style.border = "2px solid #007bff";
    }

    function selectSpecial() {
      var s = document.querySelectorAll(".special");

      for (var i = 0; i < s.length; i++) {
        s[i].innerHTML = "special " + (i + 1);
        s[i].style.fontWeight = "bold";
      }
    }

    function selectFirst() {
      var f = document.querySelector(".container .box");
      f.innerHTML = "첫 번째 컨테이너 박스";
      f.style.backgroundColor = "#cce5ff";
    }

    function selectAll() {
      var b = document.querySelectorAll(".box");

      for (var i = 0; i < b.length; i++) {
        b[i].innerHTML = "box " + (i + 1);
        b[i].style.backgroundColor = "#ffccff";
      }
    }

    function selectComplex() {
      var c = document.querySelectorAll(".container p.box:not(.special)");

      for (var i = 0; i < c.length; i++) {
        c[i].innerHTML = "복합 선택!";
        c[i].style.backgroundColor = "#ccffcc";
      }
    }

    function selectInput() {
      var text = document.querySelector('input[type="text"]');
      var email = document.querySelector('input[type="email"]');

      t.value = "설정된 값";
      t.style.backgroundColor = "#fff3cd";

      e.value = "test@example.com";
      e.style.backgroundColor = "#d1ecf1";
    }

  </script>

</body>

</html>
