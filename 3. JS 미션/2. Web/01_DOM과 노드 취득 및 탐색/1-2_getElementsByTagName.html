<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            padding: 100px;
            margin: auto;
            max-width: 500px;
        }

        p {
            padding: 20px;
            margin: 10px;
            border: 1px solid #bebebe;
            border-radius: 5px;
        }

        li {
            padding: 5px;
        }

        button {
            padding: 10px;
            margin: 5px;
            background-color: #2477b3;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            padding: 10px;
            margin: 5px;
            background-color: #1b2378;
            color: #ffffff;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <p>첫 번째 문단입니다.</p>
    <p>두 번째 문단입니다.</p>
    <p>세 번째 문단입니다.</p>

    <ul>
        <li>첫 번째 목록</li>
        <li>두 번째 목록</li>
        <li>세 번째 목록</li>
        <li>네 번째 목록</li>
    </ul>

    <button onclick="changeP()">모든 문단 선택</button>
    <button onclick="changeList()">모든 목록 선택</button>
    <button onclick="changeFirstP()">첫 번째 문단만 선택</button>

    <script>
        function changeP() {
            var p = document.getElementsByTagName("p");

            for (var i = 0; i < p.length; i++) {
                p[i].innerHTML = "선택된 문단 " + (i + 1);
                p[i].style.backgroundColor = "#ffffdc";
            }
        }

        function changeList() {
            var li = document.getElementsByTagName("li");

            for (var i = 0; i < li.length; i++) {
                li[i].innerHTML = "새로운 목록 항목 " + (i + 1);
                li[i].style.fontWeight = "bold";
                li[i].style.color = "#2477b3";
            }
        }

        function changeFirstP() {
            var p = document.getElementsByTagName("p");

            if (p.length > 0) {
                p[0].innerHTML = "첫 번째 문단만 선택되었습니다!";
                p[0].style.backgroundColor = "#ccffcc";
            }
        }
    </script>
</body>

</html>
