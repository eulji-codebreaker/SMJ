<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            padding: 100px;
            margin: auto;
            max-width: 500px;
        }

        .box {
            padding: 20px;
            margin: 10px;
            border: 1px solid #bebebe;
            border-radius: 5px;
        }

        .highlight {
            background-color: #ffffcc;
            border-color: #ffcc00;
        }

        .item {
            padding: 5px;
            margin: 5px;
            background-color: #e9ecef;
            border-left: 3px solid #007bff;
        }


        button {
            padding: 10px;
            margin: 5px;
            background-color: #2477b3;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            padding: 10px;
            margin: 5px;
            background-color: #1b2378;
            color: #ffffff;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="box">첫 번째 박스</div>
    <div class="box">두 번째 박스</div>
    <div class="box highlight">세 번째 박스 (하이라이트)</div>

    <div class="item">첫 번째 아이템</div>
    <div class="item">두 번째 아이템</div>
    <div class="item">세 번째 아이템</div>
    <div class="item">네 번째 아이템</div>

    <p class="highlight">하이라이트된 문단입니다.</p>

    <button onclick="changeAllBoxes()">모든 박스 선택</button>
    <button onclick="changeAllItems()">모든 아이템 선택</button>
    <button onclick="changeHighlights()">하이라이트 선택</button>

    <script>

        function changeAllBoxes() {
            var box = document.getElementsByClassName("box");

            for (var i = 0; i < box.length; i++) {
                box[i].innerHTML = "선택된 박스 " + (i + 1);
                box[i].style.backgroundColor = "#ffcccc";
                box[i].style.color = "#333";
            }
        }

        function changeAllItems() {
            var item = document.getElementsByClassName("item");

            for (var i = 0; i < item.length; i++) {
                item[i].innerHTML = "새로운 아이템 " + (i + 1);
                item[i].style.backgroundColor = "#ccffcc";
                item[i].style.borderLeftColor = "#28a745";
            }
        }

        function changeHighlights() {
            var h = document.getElementsByClassName("highlight");

            for (var i = 0; i < h.length; i++) {
                h[i].style.backgroundColor = "#ffdddd";
                h[i].style.fontWeight = "bold";
                h[i].innerHTML = h[i].innerHTML + " (수정됨)";
            }
        }

    </script>

</body>

</html>
